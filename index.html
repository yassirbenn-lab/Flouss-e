function avgSavings(){
  var arr=[];
  for(var i=1;i<=6;i++){
    var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    var mk=d.getFullYear()+"-"+pad(d.getMonth()+1);
    var list=S.txs.filter(function(tx){ return isAct(tx,mk); });
    var inc=list.filter(function(tx){ return tx.type==="income"&&!tx.isTransfer; }).reduce(function(s,tx){ return s+tx.amt; },0);
    var exp=list.filter(function(tx){ return tx.type==="expense"&&!tx.isTransfer; }).reduce(function(s,tx){ return s+tx.amt; },0);
    var sv=inc-exp; if(sv!==0) arr.push(sv);
  }
  return arr.length?arr.reduce(function(a,b){ return a+b; },0)/arr.length:0;
}
function goalProj(g){
  var tb=totBal()+stVal(), rem=g.target-tb, avg=avgSavings();
  var estMonths=null, estLabel="—";
  if(avg>0&&rem>0){ estMonths=Math.ceil(rem/avg); var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+estMonths); estLabel=d.toLocaleString(lang()==="ar"?"ar-MA":lang()==="en"?"en-US":"fr-FR",{month:"long",year:"numeric"}); }
  else if(rem<=0){ estLabel="✅ Atteint !"; }
  else { estLabel="Épargne insuffisante"; }
  var needPerMonth=null;
  if(g.deadline&&rem>0){
    var now=new Date(); now.setDate(1);
    var end=new Date(g.deadline+"-01");
    var diff=Math.max(1,(end.getFullYear()-now.getFullYear())*12+(end.getMonth()-now.getMonth()));
    needPerMonth=rem/diff;
  }
  return{rem:rem,avg:avg,estMonths:estMonths,estLabel:estLabel,needPerMonth:needPerMonth,tb:tb};
}

function get4Months(){
  var result=[];
  for(var i=3;i>=0;i--){
    var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-i);
    var mk=d.getFullYear()+"-"+pad(d.getMonth()+1);
    var list=S.txs.filter(function(tx){ return isAct(tx,mk); });
    var inc=list.filter(function(tx){ return tx.type==="income"&&!tx.isTransfer; }).reduce(function(s,tx){ return s+tx.amt; },0);
    var exp=list.filter(function(tx){ return tx.type==="expense"&&!tx.isTransfer; }).reduce(function(s,tx){ return s+tx.amt; },0);
    var label=new Date(d).toLocaleString(lang()==="ar"?"ar-MA":lang()==="en"?"en-US":"fr-FR",{month:"short"});
    result.push({label:label,inc:inc,exp:exp});
  }
  return result;
}

function drawLineChart(){
  var canvas=$("lineChart"); if(!canvas) return;
  var data=get4Months();
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var W=canvas.offsetWidth||320, H=155;
  canvas.width=W*dpr; canvas.height=H*dpr;
  canvas.style.height=H+"px";
  var ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);

  var pL=48,pR=14,pT=14,pB=32,cW=W-pL-pR,cH=H-pT-pB;
  var allV=data.map(function(d){ return Math.max(d.inc,d.exp,0); });
  var maxV=Math.max.apply(null,allV.concat([1000]));
  maxV=Math.ceil(maxV/1000)*1000;

  var xP=function(i){ return pL+(data.length>1?i/(data.length-1):0.5)*cW; };
  var yP=function(v){ return pT+cH*(1-Math.min(v,maxV)/maxV); };

  // grid
  ctx.strokeStyle="#1e2535"; ctx.lineWidth=1;
  for(var g=0;g<=4;g++){
    var gy=pT+(g/4)*cH;
    ctx.beginPath(); ctx.moveTo(pL,gy); ctx.lineTo(pL+cW,gy); ctx.stroke();
    var yVal=maxV*(1-g/4);
    ctx.fillStyle="#6b7688";
    ctx.font="10px -apple-system,sans-serif";
    ctx.textAlign="right";
    ctx.fillText(yVal>=1000?Math.round(yVal/1000)+"k":Math.round(yVal), pL-6, gy+4);
  }

  // x labels
  ctx.textAlign="center"; ctx.fillStyle="#6b7688";
  data.forEach(function(d,i){ ctx.fillText(d.label,xP(i),H-6); });

  function drawFill(vals,lineClr,fillClr){
    if(data.length<1) return;
    var pts=vals.map(function(v,i){ return{x:xP(i),y:yP(v)}; });
    // fill
    ctx.beginPath();
    if(pts.length===1){
      ctx.arc(pts[0].x,pts[0].y,3,0,Math.PI*2);
    } else {
      ctx.moveTo(pts[0].x,pts[0].y);
      for(var i=0;i<pts.length-1;i++){
        var mx=(pts[i].x+pts[i+1].x)/2;
        ctx.bezierCurveTo(mx,pts[i].y,mx,pts[i+1].y,pts[i+1].x,pts[i+1].y);
      }
    }
    ctx.lineTo(pts[pts.length-1].x,pT+cH);
    ctx.lineTo(pts[0].x,pT+cH);
    ctx.closePath();
    ctx.fillStyle=fillClr; ctx.fill();
    // line
    ctx.beginPath();
    if(pts.length===1){ ctx.arc(pts[0].x,pts[0].y,3,0,Math.PI*2); ctx.fillStyle=lineClr; ctx.fill(); return; }
    ctx.moveTo(pts[0].x,pts[0].y);
    for(var i=0;i<pts.length-1;i++){
      var mx=(pts[i].x+pts[i+1].x)/2;
      ctx.bezierCurveTo(mx,pts[i].y,mx,pts[i+1].y,pts[i+1].x,pts[i+1].y);
    }
    ctx.strokeStyle=lineClr; ctx.lineWidth=2.5; ctx.lineJoin="round"; ctx.stroke();
    // dots
    pts.forEach(function(pt){
      ctx.beginPath(); ctx.arc(pt.x,pt.y,3.5,0,Math.PI*2);
      ctx.fillStyle=lineClr; ctx.fill();
    });
  }

  drawFill(data.map(function(d){ return d.exp; }),"#f87171","rgba(248,113,113,0.13)");
  drawFill(data.map(function(d){ return d.inc; }),"#4ade80","rgba(74,222,128,0.17)");
}

function drawDonutChart(){
  var canvas=$("donutChart"); if(!canvas) return;
  var legend=$("donutLegend");
  var ml=mTxs().filter(function(tx){ return tx.type==="expense"&&!tx.isTransfer; });
  var catMap={};
  ml.forEach(function(tx){ catMap[tx.cat]=(catMap[tx.cat]||0)+tx.amt; });
  var items=Object.keys(catMap).map(function(id){
    var cat=getCat(id);
    return{id:id,label:getCatLbl(id),color:cat.color,value:catMap[id]};
  }).sort(function(a,b){ return b.value-a.value; }).slice(0,7);
  var total=items.reduce(function(s,i){ return s+i.value; },0);

  if(!total||!items.length){
    canvas.style.display="none";
    if(legend) legend.innerHTML='<div style="color:#6b7688;font-size:13px;padding:30px 0;text-align:center;width:100%">Aucune dépense ce mois</div>';
    return;
  }
  canvas.style.display="";

  var dpr=Math.min(window.devicePixelRatio||1,2), size=128;
  canvas.width=size*dpr; canvas.height=size*dpr;
  canvas.style.width=size+"px"; canvas.style.height=size+"px";
  var ctx=canvas.getContext("2d"); ctx.scale(dpr,dpr);

  var cx=size/2, cy=size/2, r=size/2-5, innerR=r*0.54;
  var angle=-Math.PI/2, gap=0.025;
  items.forEach(function(item){
    var slice=(item.value/total)*Math.PI*2-gap;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r,angle,angle+slice);
    ctx.closePath(); ctx.fillStyle=item.color; ctx.fill();
    angle+=slice+gap;
  });
  // hole
  ctx.beginPath(); ctx.arc(cx,cy,innerR,0,Math.PI*2);
  ctx.fillStyle="#121720"; ctx.fill();
  // center text
  ctx.fillStyle="#f0f2f8"; ctx.textAlign="center";
  ctx.font="bold 11px -apple-system,sans-serif";
  ctx.fillText(cFmt(total),cx,cy-4);
  ctx.fillStyle="#6b7688";
  ctx.font="9px -apple-system,sans-serif";
  ctx.fillText(S.settings.currency,cx,cy+9);

  if(legend){
    legend.innerHTML=items.map(function(item,i){
      var pct=Math.round((item.value/total)*100);
      var parts=item.label.split(" "); var lbl=parts.slice(1).join(" ")||parts[0];
      return '<div style="display:flex;align-items:center;gap:7px;margin-bottom:'+(i<items.length-1?"7":"0")+'px">'
        +'<div style="width:9px;height:9px;border-radius:3px;background:'+item.color+';flex-shrink:0"></div>'
        +'<div style="min-width:0;flex:1">'
        +'<div style="font-size:11px;color:#a0a8b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+lbl+'</div>'
        +'<div style="font-size:11px;font-weight:700;color:#f0f2f8">'+fmt(item.value)+'</div>'
        +'</div>'
        +'<div style="font-size:11px;color:#6b7688;flex-shrink:0;font-weight:600">'+pct+'%</div>'
        +'</div>';
    }).join("");
  }
}

// ── Google Auth ───────────────────────────────────────────
window.initGoogleAuth=function(){
  if(typeof google==="undefined"||!google.accounts) return;
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:window.handleGoogleCredential,auto_select:false,cancel_on_tap_outside:true});
};
window.handleGoogleCredential=function(response){
  try{
    var parts=response.credential.split(".");
    var payload=JSON.parse(atob(parts[1].replace(/-/g,"+").replace(/_/g,"/")));
    var newUser={email:payload.email,name:payload.name,picture:payload.picture,sub:payload.sub};
    var userKey="flouss_v4_"+newUser.email.replace(/[^a-zA-Z0-9]/g,"_");
    var existingData=localStorage.getItem(userKey);
    currentUser=newUser; localStorage.setItem(USER_KEY,JSON.stringify(currentUser));
    if(!existingData){ save(); } else { try{ S=JSON.parse(existingData); }catch(e){} }
    var bg=document.getElementById("googleSignInBg"); if(bg) bg.remove();
    render();
    setTimeout(function(){ showProToast("Connecté — "+newUser.name.split(" ")[0]+" ✓"); },200);
  }catch(e){ alert("Erreur Google : "+e.message); }
};
window.openGoogleSignIn=function(){
  if(GOOGLE_CLIENT_ID&&typeof google!=="undefined"&&google.accounts){ google.accounts.id.prompt(); return; }
  var bg=document.createElement("div"); bg.id="googleSignInBg";
  bg.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:600;display:flex;align-items:center;justify-content:center;padding:20px";
  bg.innerHTML='<div style="background:#0f1623;border-radius:18px;padding:24px;width:100%;max-width:400px"><div style="text-align:center;margin-bottom:20px"><div style="font-size:36px;margin-bottom:8px">🔐</div><div style="font-size:17px;font-weight:800">Connexion Google</div></div><div style="background:rgba(201,162,39,.08);border:1px solid #c9a22730;border-radius:12px;padding:14px;margin-bottom:18px;font-size:12px;color:#c9a227;line-height:1.8">Configurez votre Google OAuth Client ID dans le code source pour activer cette fonctionnalité.</div><button onclick="document.getElementById(\'googleSignInBg\').remove()" style="background:transparent;border:1px solid #2a3548;border-radius:10px;padding:13px;font-size:14px;font-weight:600;color:#6b7688;cursor:pointer;width:100%">Fermer</button></div>';
  document.body.appendChild(bg);
};
window.signOut=function(){
  save(); currentUser=null; localStorage.removeItem(USER_KEY);

window.analyzeVoice=async function(){
  var text=($("voiceTxt")&&$("voiceTxt").value||"").trim(); if(!text) return;
  var btn=$("voiceBtn"); if(btn){ btn.textContent="⏳ Analyse…"; btn.disabled=true; }
  try{
    var catList=S.cats.map(function(c){ return c.id+"="+(c.labels[lang()]||c.labels.fr); }).join(", ");
    var accList=S.accs.map(function(a){ return a.id+"="+a.name; }).join(", ");
    var res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:300,messages:[{role:"user",content:'Extract a financial transaction from: "'+text+'"\nCategories: '+catList+'\nAccounts: '+accList+'\nToday: '+TODAY()+'\nReply ONLY with JSON:\n{"type":"expense","amt":350,"desc":"Courses","cat":"alimentation","accId":"'+(S.accs[0]&&S.accs[0].id||"a1")+'","date":"'+TODAY()+'"}'}]})});
    var data=await res.json();
    var raw=(data.content&&data.content.find(function(b){ return b.type==="text"; })&&data.content.find(function(b){ return b.type==="text"; }).text)||"";
    var p=JSON.parse(raw.replace(/```json|```/g,"").trim());
    if(p&&p.amt>0){
      window._voiceTx=p;
      var acc=S.accs.find(function(a){ return a.id===p.accId; });
      var vr=$("voiceRes");
      if(vr) vr.innerHTML='<div style="font-size:14px;font-weight:700;color:#4ade80;text-align:center;margin:14px 0 10px">✅ Transaction détectée</div>'
        +'<div style="background:#0d1117;border-radius:12px;padding:16px;margin-bottom:16px">'
        +[["Catégorie",getCatLbl(p.cat)],["Montant",fmt(p.amt)],["Description",p.desc],["Compte",(acc&&acc.name)||"—"]].map(function(r,i){ return '<div style="display:flex;justify-content:space-between;font-size:13px;padding:8px 0;'+(i<3?"border-bottom:1px solid #1e2535":"")+'" ><span style="color:#6b7688">'+r[0]+'</span><span style="font-weight:600">'+r[1]+'</span></div>'; }).join("")
        +'</div><button class="btnP" onclick="confirmVoice()" style="margin-top:0">✓ Confirmer & ajouter</button><button class="btnG" onclick="retryVoice()">Réessayer</button>';
      if(btn) btn.style.display="none";
    }
  }catch(e){ if(btn){ btn.textContent="✨ Analyser avec l'IA"; btn.disabled=false; } var vr=$("voiceRes"); if(vr) vr.innerHTML='<div style="color:#f87171;font-size:13px;text-align:center;margin-top:8px">Impossible d\'analyser. Réessayez.</div>'; }
};
window.confirmVoice=function(){ var tx=window._voiceTx; if(!tx) return; S.txs.unshift({id:uid(),type:tx.type,cat:tx.cat,amt:tx.amt,date:tx.date,desc:tx.desc,accId:tx.accId,rec:"once",endDate:""}); S.accs=S.accs.map(function(a){ return a.id===tx.accId?Object.assign({},a,{balance:a.balance+(tx.type==="income"?tx.amt:-tx.amt)}):a; }); save(); closeModal(); render(); };
window.retryVoice=function(){ var vr=$("voiceRes"); if(vr) vr.innerHTML=""; var btn=$("voiceBtn"); if(btn){ btn.textContent="✨ Analyser avec l'IA"; btn.disabled=false; btn.style.display=""; } var vt=$("voiceTxt"); if(vt) vt.value=""; };

// ── Sync quotes ───────────────────────────────────────────
window.syncQuotes=async function(){
  if(!S.stocks.length) return;
  var sm=$("syncMsg");
  if(sm) sm.innerHTML='<div class="card" style="padding:10px 14px;font-size:13px;color:#fbbf24;margin-bottom:8px">⏳ Récupération des cours…</div>';
  var cryptoMap={BTC:"bitcoin",ETH:"ethereum",BNB:"binancecoin",XRP:"ripple",SOL:"solana",ADA:"cardano",DOGE:"dogecoin"};
  var updated=0;
  var cryptoStocks=S.stocks.filter(function(s){ return cryptoMap[s.ticker.toUpperCase()]; });
  if(cryptoStocks.length>0){
    try{
      var ids=cryptoStocks.map(function(s){ return cryptoMap[s.ticker.toUpperCase()]; }).join(",");
      var curr=S.settings.currency.toLowerCase();
      var r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids="+ids+"&vs_currencies="+curr+",usd");
      var d=await r.json();
      S.stocks=S.stocks.map(function(s){ var cgId=cryptoMap[s.ticker.toUpperCase()]; if(!cgId) return s; var e=d[cgId]; if(!e) return s; var p=e[curr]||e.usd||0; if(p>0){ updated++; return Object.assign({},s,{curPrice:Math.round(p*100)/100}); } return s; });
    }catch(e){}
  }
  save(); render();
  var now=new Date(), ts=pad(now.getHours())+":"+pad(now.getMinutes());
  if(sm) sm.innerHTML='<div class="card" style="padding:10px 14px;font-size:13px;color:#4ade80;margin-bottom:8px;display:flex;justify-content:space-between"><span>✅ '+updated+' cours mis à jour</span><span style="color:#6b7688;font-size:11px">'+ts+'</span></div>';
  setTimeout(function(){ if(sm) sm.innerHTML=""; },5000);
};

// ── Export CSV ────────────────────────────────────────────
window.exportCSV=function(){
  var lines=[], q=function(v){ return '"'+String(v||"").replace(/"/g,'""')+'"'; }, row=function(arr){ return arr.map(q).join(",")+"\r\n"; };
  lines.push(row(["FLOUSS-E — EXPORT"])); lines.push(row(["Généré le",new Date().toLocaleDateString("fr-FR")])); lines.push(row([]));
  lines.push(row(["=== COMPTES ==="])); lines.push(row(["Nom","Banque","Solde"]));
  S.accs.forEach(function(a){ lines.push(row([a.name,a.bank,a.balance])); });
  lines.push(row([])); lines.push(row(["=== TRANSACTIONS ==="])); lines.push(row(["Date","Description","Type","Catégorie","Montant","Compte","Récurrence","Virement"]));
  S.txs.slice().sort(function(a,b){ return b.date.localeCompare(a.date); }).forEach(function(tx){ var acc=S.accs.find(function(a){ return a.id===tx.accId; }); lines.push(row([tx.date,tx.desc,tx.type==="income"?"Revenu":"Dépense",getCatLbl(tx.cat),tx.type==="income"?tx.amt:-tx.amt,acc?acc.name:"—",tx.rec||"once",tx.isTransfer?"Oui":"Non"])); });
  var csv="\uFEFF"+lines.join(""), dateStr=new Date().getFullYear()+"-"+pad(new Date().getMonth()+1)+"-"+pad(new Date().getDate()), fileName="Flouss-e_"+dateStr+".csv";
  var a=document.createElement("a"); a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv); a.download=fileName; a.style.display="none"; document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); },1000);
};

window.exportExcel=function(){
  var btn=document.querySelector("[onclick=\"exportExcel()\"]");
  if(btn){ btn.textContent="⏳ Génération…"; btn.disabled=true; }
  try{
    function x(v){ return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function sheet(name,rows){ var xml='<Worksheet ss:Name="'+x(name)+'"><Table>'; rows.forEach(function(row){ if(!row){ xml+='<Row><Cell><Data ss:Type="String"></Data></Cell></Row>'; return; } xml+='<Row>'; row.forEach(function(cell){ if(cell===null||cell===undefined){ xml+='<Cell><Data ss:Type="String"></Data></Cell>'; return; } var isNum=typeof cell==="number"&&!isNaN(cell); xml+='<Cell><Data ss:Type="'+(isNum?"Number":"String")+'">'+x(isNum?cell:String(cell))+'</Data></Cell>'; }); xml+='</Row>'; }); xml+='</Table></Worksheet>'; return xml; }
    var ml=mTxs(), tb=totBal(), sv=stVal(), sg=stGain(), sc=stCost(), tbAll=tb+sv;
    var wsR=sheet("Résumé",[["FLOUSS-E"],["Généré le",new Date().toLocaleDateString("fr-FR")],null,["Comptes",tb],["Portefeuille",sv],["Total",tbAll]]);
    var ar=[["Nom","Banque","Solde"]]; S.accs.forEach(function(a){ ar.push([a.name,a.bank,a.balance]); });
    var tr=[["Date","Description","Type","Catégorie","Montant","Compte"]]; S.txs.slice().sort(function(a,b){ return b.date.localeCompare(a.date); }).forEach(function(tx){ var acc=S.accs.find(function(a){ return a.id===tx.accId; }); tr.push([tx.date,tx.desc,tx.type==="income"?"Revenu":"Dépense",getCatLbl(tx.cat),tx.type==="income"?tx.amt:-tx.amt,acc?acc.name:"—"]); });
    var br=[["Catégorie","Planifié","Dépensé","Restant"]]; S.budget.forEach(function(b){ var sp=ml.filter(function(t){ return t.type==="expense"&&t.cat===b.cat&&!t.isTransfer; }).reduce(function(s,t){ return s+t.amt; },0); br.push([getCatLbl(b.cat),b.planned,sp,b.planned-sp]); });
    var pr=[["Symbole","Nom","Secteur","Titres","Px achat","Cours","Valeur","Plus-value"]]; S.stocks.forEach(function(st){ var val=st.curPrice*st.shares, gain=(st.curPrice-st.buyPrice)*st.shares; pr.push([st.ticker,st.name,st.sector,st.shares,st.buyPrice,st.curPrice,val,gain]); });
    var workbook='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:x="urn:schemas-microsoft-com:office:excel"><Styles><Style ss:ID="h"><Font ss:Bold="1"/></Style></Styles>'+wsR+sheet("Comptes",ar)+sheet("Transactions",tr)+sheet("Budget",br)+sheet("Portefeuille",pr)+'</Workbook>';
    var dateStr=new Date().getFullYear()+"-"+pad(new Date().getMonth()+1)+"-"+pad(new Date().getDate()), fileName="Flouss-e_"+dateStr+".xls";
    var dataUri="data:application/vnd.ms-excel;charset=utf-8,"+encodeURIComponent(workbook);
    if(navigator.share){ try{ var blob=new Blob([workbook],{type:"application/vnd.ms-excel"}), file=new File([blob],fileName,{type:"application/vnd.ms-excel"}); if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Flouss-e Export"}); if(btn){btn.textContent="📊 Exporter Excel";btn.disabled=false;} return;} }catch(e){} }
    var a=document.createElement("a"); a.href=dataUri; a.download=fileName; a.style.display="none"; document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); },1000);
    if(btn){ btn.textContent="✅ Prêt !"; setTimeout(function(){ btn.textContent="📊 Exporter Excel"; btn.disabled=false; },2000); }
  }catch(e){ alert("Erreur export : "+e.message); if(btn){ btn.textContent="📊 Exporter Excel"; btn.disabled=false; } }
};
